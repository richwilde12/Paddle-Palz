<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paddle Round Robin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f7a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Padel">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="app-css">
:root{
  --bg:#f3f6f2; --card:#ffffff; --ink:#14201a; --muted:#64716a; --line:#dde5df;
  --accent:#1f7a4d; --accent-ink:#ffffff; --accent-soft:#e2f1e8; --ball:#d9f24a;
  --win:#1f7a4d; --loss:#b4483b; --draw:#8a7a2b; --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1512; --card:#18211c; --ink:#e8efe9; --muted:#93a198; --line:#2a352f;
    --accent:#3fae77; --accent-ink:#06120b; --accent-soft:#1c3427; --win:#5fc791; --loss:#e07c6f; --draw:#d1bf62; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 80px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 2px 14px}
h1{font-family:"Bricolage Grotesque",Inter,sans-serif;font-weight:800;font-size:26px;line-height:1.05;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.status.warn{color:var(--loss)}
button.status{background:none;border:0;padding:4px 0;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.diag dt{font-size:12px;color:var(--muted);font-weight:600;margin-top:10px}
.diag dd{margin:2px 0 0;font-size:13px;overflow-wrap:anywhere}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;min-width:0;border:0;background:transparent;padding:9px 2px;font-size:14px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stack>*+*{margin-top:14px}
.progress{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.round-h{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px}
.round-h h2{font-family:"Bricolage Grotesque",Inter,sans-serif;font-size:17px;margin:0}
.round-h span{font-size:12px;color:var(--muted)}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;margin-bottom:8px}
.match:active{transform:scale(.99)}
.match .t{font-weight:600;overflow-wrap:anywhere}
.match .t.b{text-align:right}
.match .t.dim{color:var(--muted);font-weight:500}
.match .t small{display:block;font-weight:inherit}
.match .sc{min-width:74px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.match .sc .big{font-size:18px}
.match .sc .sets{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.match .sc .vs{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700}
.court{grid-column:1/-1;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:-4px}
.bye{font-size:12px;color:var(--muted);margin:-2px 2px 8px}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
th.l,td.l{text-align:left}
td{padding:11px 4px;text-align:center;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.pos{width:26px;color:var(--muted);font-weight:600}
td.name{font-weight:600;overflow-wrap:anywhere}
td.pts{font-weight:800;font-size:16px}
tr.lead td.pos{color:var(--ink)}
tr.lead td.pos span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ball);color:#14201a}
.form{display:inline-flex;gap:3px}
.form i{width:8px;height:8px;border-radius:50%;display:inline-block}
.form .W{background:var(--win)}.form .L{background:var(--loss)}.form .D{background:var(--draw)}
@media (max-width:460px){.hide-sm{display:none}}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=number],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);outline:none}
input:focus,select:focus{border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center}
.row+.row{margin-top:8px}
.row .n{width:22px;color:var(--muted);font-size:13px;text-align:right;flex:none}
.icon{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px;line-height:1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);padding:10px 6px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.seg.big button{padding:12px 6px}
.seg.big button small{display:block;font-weight:500;font-size:11px;margin-top:2px;opacity:.85}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:15px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1px solid var(--loss);color:var(--loss)}
.btn.danger.armed{background:var(--loss);color:#fff}
.btn.armed:not(.danger){background:var(--ball);color:#14201a}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.note{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
@media (min-width:600px){.scrim{align-items:center}}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 16px 22px;max-height:92vh;overflow:auto}
@media (min-width:600px){.sheet{border-radius:18px}}
.sheet h3{margin:0 0 4px;font-family:"Bricolage Grotesque",Inter,sans-serif;font-size:18px}
.vsline{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:12px 0 16px;font-weight:700}
.vsline div:last-child{text-align:right}
.vsline span{color:var(--muted);font-weight:500;font-size:12px}
.stepper{display:flex;flex-direction:column;align-items:center;gap:8px}
.stepper input.val{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;width:96px;text-align:center;padding:8px 4px;background:var(--bg)}
.stepper .ctl{display:flex;gap:8px}
.stepper button{width:46px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:700;cursor:pointer}
.setgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px 10px;align-items:center}
.setgrid .lab{font-size:12px;color:var(--muted);font-weight:600}
.setgrid input{text-align:center;font-size:18px;font-weight:700;padding:10px}
.setgrid .hd{font-size:12px;font-weight:700;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:grid;gap:8px;margin-top:18px}
.err{color:var(--loss);font-size:13px;margin-top:8px}
.banner{font-size:13px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);margin-bottom:12px;color:var(--muted)}
.busy{opacity:.6;pointer-events:none}
.vs.live{background:var(--ball);color:#14201a}
.vs.live:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#c0392b;margin-right:5px;vertical-align:middle;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.live-wrap{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding:12px 12px calc(14px + env(safe-area-inset-bottom));-webkit-user-select:none;user-select:none;touch-action:manipulation}
.live-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.live-top .ttl{font-weight:700;font-size:14px}
.live-top .ttl span{display:block;font-weight:500;color:var(--muted);font-size:12px}
.lp{flex:1;min-height:0;width:100%;border:2px solid var(--line);border-radius:20px;margin:6px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;background:var(--card);-webkit-tap-highlight-color:transparent;transition:transform .08s}
.lp:active{transform:scale(.98)}
.lp:disabled{cursor:default;opacity:.75}
.lp.serving{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lp.won{border-color:var(--ball);box-shadow:0 0 0 3px var(--ball)}
.lp .num{font-size:min(26vw,24vh,150px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;font-family:"Bricolage Grotesque",Inter,sans-serif}
.lp .nm{font-weight:600;font-size:16px;text-align:center;padding:0 10px}
.lp .nm b{font-weight:800}
.lp .tap{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.lmid{text-align:center;font-size:14px;padding:4px 6px;line-height:1.35}
.lmid .k{font-size:12px;color:var(--muted)}
.ends{background:var(--ball);color:#14201a;border-radius:12px;padding:8px;text-align:center;font-weight:700;margin:4px 0}
.lbar{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:4px}
.lbar .btn{padding:13px}
.rules h2{font-family:"Bricolage Grotesque",Inter,sans-serif;font-size:18px;margin:0 0 8px}
.rules p{margin:0 0 8px}
.rules ul{margin:0 0 4px;padding-left:20px}
.rules li{margin:4px 0}
.rules .ex{font-size:13px;color:var(--muted)}
.serve{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin:10px 0 6px;font-variant-numeric:tabular-nums}
.serve .who{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-weight:800;font-size:13px}
.serve .p1{background:var(--accent);color:var(--accent-ink)}
.serve .p2{background:var(--ball);color:#14201a}
.serve .lbl{font-weight:600}
.serve .rng{color:var(--muted);font-size:13px}
.svline{font-size:13px;background:var(--bg);border-radius:10px;padding:10px 12px;margin:-4px 0 14px}
.svline b{font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<script id="app-src">
(function(){
  "use strict";
  var DEFAULT = {v:2,mode:"teams",name:"Paddle Round Robin",scoring:"games",pts:{w:3,d:1,l:0},courts:2,double:false,
    ppm:24,rounds:0,rankBy:"total",minMatches:0,startedAt:0,
    teams:[{id:"t1",name:""},{id:"t2",name:""},{id:"t3",name:""},{id:"t4",name:""}],
    matches:[],started:false,updatedAt:0};
  /* =====================================================================
     PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE (it ends in /exec)
     Leave it empty to save on this phone only.
     ===================================================================== */
  var SHEET_API_URL = "https://script.google.com/macros/s/AKfycbygrvh4djrigRgFz0W254BnHd-3no5Ul9m8rtedOm1Xr16GzUSa7KKyhTxJiSuU-EOs/exec";
  /* ===================================================================== */

  // Each tournament lives at tournaments/<id>. Use ?t=name in the URL to run a separate event.
  var TID = ((new URLSearchParams(location.search).get("t")) || "main").replace(/[^a-zA-Z0-9_-]/g,"").slice(0,40) || "main";
  var LSKEY = "rr-tracker-state" + (TID==="main" ? "" : "-"+TID);
  var local = null;
  try { local = JSON.parse(localStorage.getItem(LSKEY)); } catch(e){}
  function normalise(v){
    v = v || {};
    Object.keys(DEFAULT).forEach(function(k){ if (v[k]===undefined) v[k]=JSON.parse(JSON.stringify(DEFAULT[k])); });
    if (!Array.isArray(v.matches)) v.matches = Object.keys(v.matches||{}).map(function(k){ return v.matches[k]; });
    v.matches.forEach(function(m){ if (!m.score) m.score=null; });
    v.matches.sort(function(x,y){return x.r-y.r||x.i-y.i;});
    if (!Array.isArray(v.teams)) v.teams = Object.keys(v.teams||{}).map(function(k){ return v.teams[k]; });
    return v;
  }
  var S = normalise(local || JSON.parse(JSON.stringify(DEFAULT)));
  var ui = {tab: S.started ? "matches" : "setup", unplayedOnly:false, modal:null, resetArmed:false, copied:false};
  var readOnly = false;
  var USE_API = /^https:\/\/script\.google(usercontent)?\.com\//.test(SHEET_API_URL.trim());
  var net = USE_API ? "connecting" : "local";   // connecting | live | offline | error | local
  var loaded = !USE_API, pendingRender = false;
  var ver = -1, queue = [], inflight = null, flushTimer = null, pollTimer = null;

  function AM(){ return S.mode==="americano"; }
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function team(id){for(var i=0;i<S.teams.length;i++) if(S.teams[i].id===id) return S.teams[i]; return null;}
  function tname(id){var t=team(id); return t ? (t.name||"Unnamed") : "?";}
  function side(m,s){ var v=m[s]; return Array.isArray(v) ? v.map(tname).join(" & ") : tname(v); }
  function sideHTML(m,s){ var v=m[s]; return Array.isArray(v) ? v.map(function(id){return '<small>'+esc(tname(id))+'</small>';}).join("") : esc(tname(v)); }
  function uid(p){return p+Math.random().toString(36).slice(2,8);}
  function key(a,b){return a<b? a+"|"+b : b+"|"+a;}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function sign(n){return n>0?"+"+n:String(n);}

  /* ---------- persistence (Google Sheet via Apps Script) ---------- */
  var QKEY = LSKEY + "-queue", HKEY = LSKEY + "-history";
  var H = {sessions:[]}, hv = -1, histLoading = false;
  try { var hh = JSON.parse(localStorage.getItem(HKEY)); if (hh && Array.isArray(hh.sessions)) H = hh; } catch(e){}
  function cacheHistory(){ try { localStorage.setItem(HKEY, JSON.stringify(H)); } catch(e){} }
  function setHistory(h, v){
    if (!h || !Array.isArray(h.sessions)) return;
    H = h; if (v!=null) hv = v; cacheHistory();
    if (loaded && (ui.tab==="overall" || (ui.modal && ui.modal.kind==="session"))) remoteRender();
  }
  function fetchHistory(){
    if (!USE_API || histLoading) return;
    histLoading = true;
    fetch(SHEET_API_URL.trim() + "?t=" + encodeURIComponent(TID) + "&history=1", {cache:"no-store"})
      .then(readJSON).then(function(res){ histLoading = false; if (res && res.ok && !(inflight && inflight.op==="archive") && !queue.some(function(q){return q.op==="archive"||q.op==="deleteSession";})) setHistory(res.history, res.hv); })
      .catch(function(){ histLoading = false; });
  }
  function cacheLocal(){ try { localStorage.setItem(LSKEY, JSON.stringify(S)); } catch(e){} }
  function saveQueue(){ try { localStorage.setItem(QKEY, JSON.stringify((inflight?[inflight]:[]).concat(queue))); } catch(e){} }
  function sameKey(x,y){ return x.op===y.op && (x.op==="setAll" || (x.op==="live" && x.id===y.id)); }
  // finished sessions go through the queue too, so they survive a lost signal
  function enqueue(op){
    if (!USE_API) return;
    queue = queue.filter(function(q){ return !sameKey(q,op); });
    queue.push(op); saveQueue();
    clearTimeout(flushTimer);
    flushTimer = setTimeout(flush, op.op==="live" ? 250 : 0);
  }
  var diag = {get:"Not tried yet", post:"Nothing sent yet", getAt:0, postAt:0};
  function readJSON(r){
    return r.text().then(function(t){
      try { return JSON.parse(t); }
      catch(e){
        var msg = t.replace(/<style[\s\S]*?<\/style>|<script[\s\S]*?<\/script>/gi," ").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim().slice(0,200);
        throw new Error("Got a web page instead of data (HTTP "+r.status+"): "+(msg||"empty"));
      }
    });
  }
  function errText(e){ return (e && e.message) ? e.message : String(e); }
  function post(body){
    return fetch(SHEET_API_URL.trim(), {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body)})
      .then(readJSON);
  }
  function flush(){
    if (inflight || !queue.length) return;
    var op = queue.shift(); inflight = op; saveQueue(); renderStatus();
    var body = Object.assign({t:TID}, op);
    if (op.op!=="live") body.sheet = sheetSummary();
    post(body).then(function(res){
      inflight = null;
      diag.postAt = Date.now();
      if (!res || !res.ok){
        var why = (res && res.error) || "unknown error";
        diag.post = "Sheet replied with an error: " + why + " (" + op.op + ")";
        if (/No tournament yet/i.test(why)){
          // sheet is empty: send the whole tournament first (it already includes this change)
          queue = queue.filter(function(q){ return q.op!=="setAll"; });
          queue.unshift({op:"setAll", state:JSON.parse(JSON.stringify(S))});
          saveQueue(); setTimeout(flush, 200); return;
        }
        net = "error"; saveQueue(); renderStatus();
        if (queue.length) setTimeout(flush, 1500);
        return;
      }
      diag.post = "OK \u2013 saved (" + op.op + ")";
      net = "live"; ver = res.v; saveQueue();
      if (res.history && !queue.some(function(q){return q.op==="archive"||q.op==="deleteSession";})) setHistory(res.history, res.hv);
      if (!queue.length && res.state) applyRemote(res.state);
      if (queue.length) flush(); else renderStatus();
    }).catch(function(e){
      diag.post = "Couldn\u2019t save: " + errText(e); diag.postAt = Date.now();
      if (!(op.op==="live" && queue.some(function(q){return sameKey(q,op);}))) queue.unshift(op);
      inflight = null; net = "offline"; saveQueue(); renderStatus();
      setTimeout(flush, 4000);
    });
  }
  function poll(){
    clearTimeout(pollTimer);
    var next = (ui.modal && ui.modal.kind==="live") ? 2000 : 3500;
    if (!USE_API) return;
    if (document.hidden){ pollTimer = setTimeout(poll, next); return; }
    fetch(SHEET_API_URL.trim() + "?t=" + encodeURIComponent(TID) + "&since=" + ver, {cache:"no-store"})
      .then(readJSON)
      .then(function(res){
        diag.getAt = Date.now();
        diag.get = (res && res.ok) ? "OK \u2013 sheet version " + res.v + (res.state===null ? " (empty sheet)" : "") : "Sheet replied with an error: " + ((res && res.error) || "unknown");
        if (!res || res.error){ net = "error"; if (!loaded){ loaded = true; render(); } else renderStatus(); return; }
        net = "live";
        var first = !loaded;
        if (res.hv!==undefined && res.hv!==hv) fetchHistory();
        if (!res.same){
          if (res.state){
            if (res.v > ver && !inflight && !queue.length){ ver = res.v; applyRemote(res.state); }
          } else if (first){
            // empty sheet: upload what this phone has, ahead of any older waiting changes
            queue = [{op:"setAll", state:JSON.parse(JSON.stringify(S))}]; saveQueue(); setTimeout(flush, 0);
          }
        }
        if (first){ loaded = true; ui.tab = S.started ? "matches" : "setup"; render(); } else renderStatus();
        if (queue.length && !inflight) flush();
      })
      .catch(function(e){ diag.get = "Couldn\u2019t read: " + errText(e); diag.getAt = Date.now(); net = loaded ? "offline" : "error"; if (!loaded){ loaded = true; render(); } else renderStatus(); })
      .then(function(){ pollTimer = setTimeout(poll, next); });
  }
  function applyRemote(v){
    S = normalise(v); cacheLocal();
    if (ui.modal && ui.modal.kind!=="diag" && ui.modal.kind!=="session"){ // keep an open score sheet pointing at the fresh match object
      var fresh = S.matches.filter(function(m){return m.id===ui.modal.m.id;})[0];
      if (fresh && !(ui.modal.kind==="live" && fresh.score)) ui.modal.m = fresh; else ui.modal = null;
    }
    if (loaded) remoteRender();
  }
  // whole-tournament write: setup changes, generating fixtures, reset
  function commit(){
    S.updatedAt = Date.now(); cacheLocal();
    enqueue({op:"setAll", state:JSON.parse(JSON.stringify(S))});
    render();
  }
  // one score only, so two phones entering different matches never overwrite each other
  function commitScore(m){
    S.updatedAt = Date.now(); cacheLocal();
    enqueue({op:"score", id:m.id, score:m.score ? JSON.parse(JSON.stringify(m.score)) : null});
    render();
  }
  // live point-by-point score: a string of rally winners, e.g. "aab..."
  function commitLive(m){
    cacheLocal();
    enqueue({op:"live", id:m.id, live:m.live ? {h:m.live.h, t:m.live.t} : null});
    render();
  }
  function commitNewMatches(list){
    S.updatedAt = Date.now(); cacheLocal();
    enqueue({op:"addMatches", matches:JSON.parse(JSON.stringify(list))});
    render();
  }
  // human-readable copy written to the "Results" and "Table" tabs of the sheet
  function sheetSummary(){
    var courts = Math.max(1, S.courts|0), byR = {};
    S.matches.forEach(function(m){ (byR[m.r]=byR[m.r]||[]).push(m); });
    var results = [["Round","Court", AM()?"Pair A":"Team A", AM()?"Pair B":"Team B","Score A","Score B","Status"]];
    Object.keys(byR).sort(function(a,b){return a-b;}).forEach(function(r){
      byR[r].sort(function(x,y){return x.i-y.i;}).forEach(function(m,idx){
        var res = result(m), lv = (!m.score && m.live && m.live.h) ? liveOf(m) : null;
        results.push([m.r, (idx%courts)+1, side(m,"a"), side(m,"b"),
          res ? (setsMode()? m.score.a.join(" / ") : res.ga) : "", res ? (setsMode()? m.score.b.join(" / ") : res.gb) : "",
          res ? "Played" : lv ? "Live "+lv.a+"-"+lv.b : "To play"]);
      });
    });
    var table;
    if (AM()){
      table = [["Pos","Player","Played","Won","Drawn","Lost","+/-","Average","Points"]];
      standingsAm().forEach(function(x,i){ table.push([i+1,x.name,x.p,x.w,x.d,x.l,x.diff,Math.round(x.avg*10)/10,x.pf]); });
    } else {
      table = [["Pos","Team","Played","Won","Drawn","Lost"].concat(setsMode()?["Sets +/-"]:[]).concat(["Games +/-","Points"])];
      standingsTeams().forEach(function(x,i){ table.push([i+1,x.name,x.p,x.w,x.d,x.l].concat(setsMode()?[x.sd]:[]).concat([x.gd,x.pts])); });
    }
    var overall = [["Pos","Player","Sessions","Played","Won","Drawn","Lost","+/-","Total points","Average"]];
    overallRows().forEach(function(x,i){ overall.push([x.qualified? i+1 : "\u2013", x.name, x.sessions, x.p, x.w, x.d, x.l, x.diff, x.pf, Math.round(x.avg*10)/10]); });
    var all = [["Date","Session","Round","Side A","Side B","Score A","Score B"]];
    H.sessions.forEach(function(ss){ ss.matches.forEach(function(m){ all.push([ss.date, ss.name, m.r, m.a.join(" & "), m.b.join(" & "), m.sa, m.sb]); }); });
    return {name:S.name, results:results, table:table, overall:overall, allMatches:all};
  }
  function statusText(){
    if (!USE_API) return ["Saved on this phone",""];
    if (net==="error") return ["Can’t reach the sheet","warn"];
    if (inflight || queue.length) return [net==="offline" ? "Offline – will sync" : "Saving…", net==="offline"?"warn":""];
    if (net==="offline") return ["Offline – will sync","warn"];
    if (net==="connecting") return ["Connecting…",""];
    return ["● Live",""];
  }
  function renderStatus(){
    var el = document.getElementById("status"); if(!el) return;
    var s = statusText(); el.textContent = s[0]; el.className = "status " + s[1];
  }
  function remoteRender(){
    var a = document.activeElement;
    if (a && app.contains(a) && (a.tagName==="INPUT" || a.tagName==="SELECT") && !ui.modal){ pendingRender = true; return; }
    render();
  }
  function connect(){
    if (!USE_API) return;
    try { var q = JSON.parse(localStorage.getItem(QKEY)); if (Array.isArray(q)) queue = q; } catch(e){}
    document.addEventListener("visibilitychange", function(){ if (!document.hidden){ poll(); flush(); } });
    window.addEventListener("online", function(){ flush(); poll(); });
    poll(); if (queue.length) setTimeout(flush, 500);
    setTimeout(function(){ if (!loaded){ loaded = true; net = "offline"; render(); } }, 12000);
  }

  /* ---------- fixed-team fixtures (circle method) ---------- */
  function generateTeams(){
    var ids = S.teams.map(function(t){return t.id;});
    if (ids.length % 2) ids.push(null);
    var n = ids.length, rounds = [], arr = ids.slice();
    for (var r=0;r<n-1;r++){
      var games=[];
      for (var i=0;i<n/2;i++){
        var a=arr[i], b=arr[n-1-i];
        if (r%2 && i===0){ var tmp=a; a=b; b=tmp; }
        if (a && b) games.push([a,b]);
      }
      rounds.push(games);
      arr.splice(1,0,arr.pop());
    }
    if (S.double){
      rounds = rounds.concat(rounds.map(function(g){return g.map(function(p){return [p[1],p[0]];});}));
    }
    var m=[];
    rounds.forEach(function(g,ri){ g.forEach(function(p,gi){ m.push({id:uid("m"),r:ri+1,i:gi,a:p[0],b:p[1],score:null}); }); });
    return m;
  }

  /* ---------- Americano scheduling (rotating partners) ---------- */
  function amCourts(n){ return Math.max(1, Math.min(S.courts|0 || 1, Math.floor(n/4))); }
  function autoRounds(n){
    if (n<4) return 0;
    var k = amCourts(n);
    return Math.ceil((n*(n-1)/2) / (2*k)); // enough rounds for everyone to partner everyone once
  }
  function amRounds(){ return S.rounds>0 ? S.rounds : autoRounds(S.teams.length); }

  function statsFrom(matches){
    var st={partner:{},opp:{},sits:{},played:{}};
    S.teams.forEach(function(t){st.sits[t.id]=0; st.played[t.id]=0;});
    var byR={};
    matches.forEach(function(m){
      (byR[m.r]=byR[m.r]||{})[m.a[0]]=1; byR[m.r][m.a[1]]=1; byR[m.r][m.b[0]]=1; byR[m.r][m.b[1]]=1;
      addMatch(st, m.a, m.b);
    });
    Object.keys(byR).forEach(function(r){ S.teams.forEach(function(t){ if(!byR[r][t.id]) st.sits[t.id]=(st.sits[t.id]||0)+1; }); });
    return st;
  }
  function addMatch(st,a,b){
    var pk1=key(a[0],a[1]), pk2=key(b[0],b[1]);
    st.partner[pk1]=(st.partner[pk1]||0)+1; st.partner[pk2]=(st.partner[pk2]||0)+1;
    for (var i=0;i<2;i++) for (var j=0;j<2;j++){ var ok=key(a[i],b[j]); st.opp[ok]=(st.opp[ok]||0)+1; }
    a.concat(b).forEach(function(p){ st.played[p]=(st.played[p]||0)+1; });
  }
  function cloneStats(st){ return {partner:Object.assign({},st.partner),opp:Object.assign({},st.opp),sits:Object.assign({},st.sits),played:Object.assign({},st.played)}; }
  function arrCost(st,arr){ // arr length 4k: [a0,a1,b0,b1, ...]
    var c=0;
    for (var g=0; g<arr.length; g+=4){
      var p=st.partner[key(arr[g],arr[g+1])]||0, q=st.partner[key(arr[g+2],arr[g+3])]||0;
      c += 100*(p*p+p) + 100*(q*q+q);
      for (var i=0;i<2;i++) for (var j=2;j<4;j++){ var o=st.opp[key(arr[g+i],arr[g+j])]||0; c += 6*o*o; }
    }
    return c;
  }
  function bestRound(st,playing){
    var best=null,bestC=Infinity, restarts = playing.length<=8 ? 30 : 15;
    for (var r=0;r<restarts;r++){
      var arr=shuffle(playing.slice()), c=arrCost(st,arr), improved=true;
      while (improved){
        improved=false;
        for (var i=0;i<arr.length;i++) for (var j=i+1;j<arr.length;j++){
          if ((i>>2)===(j>>2) && ((i&3)>>1)===((j&3)>>1)) continue; // same pair: swap is a no-op
          var t=arr[i]; arr[i]=arr[j]; arr[j]=t;
          var c2=arrCost(st,arr);
          if (c2<c){ c=c2; improved=true; } else { t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
        }
      }
      if (c<bestC){ bestC=c; best=arr.slice(); if (c===0) break; }
    }
    return {arr:best,cost:bestC};
  }
  function scheduleAmericano(existing, addRounds){
    var ids=S.teams.map(function(t){return t.id;}), n=ids.length, k=amCourts(n), sitN=n-4*k;
    var startR = existing.reduce(function(mx,m){return Math.max(mx,m.r);},0);
    var base = statsFrom(existing), bestPlan=null, bestTotal=Infinity;
    var attempts = n<=8 ? 12 : 6;
    for (var at=0; at<attempts; at++){
      var st=cloneStats(base), plan=[], total=0;
      for (var r=0;r<addRounds;r++){
        var order=shuffle(ids.slice()).sort(function(x,y){return (st.sits[x]||0)-(st.sits[y]||0) || (st.played[y]||0)-(st.played[x]||0);});
        var sitters=order.slice(0,sitN), sitSet={};
        sitters.forEach(function(p){sitSet[p]=1; st.sits[p]=(st.sits[p]||0)+1;});
        var playing=ids.filter(function(p){return !sitSet[p];});
        var res=bestRound(st,playing); total+=res.cost;
        var games=[];
        for (var g=0; g<res.arr.length; g+=4){
          var a=[res.arr[g],res.arr[g+1]], b=[res.arr[g+2],res.arr[g+3]];
          addMatch(st,a,b); games.push([a,b]);
        }
        plan.push(games);
      }
      if (total<bestTotal){ bestTotal=total; bestPlan=plan; if (total===0) break; }
    }
    var out=[];
    bestPlan.forEach(function(games,ri){ games.forEach(function(p,gi){ out.push({id:uid("m"),r:startR+ri+1,i:gi,a:p[0],b:p[1],score:null}); }); });
    return out;
  }

  /* ---------- results & tables ---------- */
  function setsMode(){ return !AM() && S.scoring==="sets"; }
  function result(m){
    if (!m.score) return null;
    var a=m.score.a, b=m.score.b, ga=0, gb=0, sa=0, sb=0;
    for (var i=0;i<a.length;i++){ ga+=a[i]; gb+=b[i]; if(a[i]>b[i]) sa++; else if(b[i]>a[i]) sb++; }
    var pa=setsMode()?sa:ga, pb=setsMode()?sb:gb;
    return {ga:ga,gb:gb,sa:sa,sb:sb,w: pa>pb?"a":pb>pa?"b":"d"};
  }
  function ordered(){ return S.matches.slice().sort(function(x,y){return x.r-y.r||x.i-y.i;}); }
  function standingsTeams(){
    var rows={};
    S.teams.forEach(function(t){ rows[t.id]={id:t.id,name:t.name||"Unnamed",p:0,w:0,d:0,l:0,gf:0,ga:0,sf:0,sa:0,pts:0,form:[]}; });
    ordered().forEach(function(m){
      var r=result(m); if(!r||!rows[m.a]||!rows[m.b]) return;
      var A=rows[m.a], B=rows[m.b];
      A.p++; B.p++; A.gf+=r.ga; A.ga+=r.gb; B.gf+=r.gb; B.ga+=r.ga; A.sf+=r.sa; A.sa+=r.sb; B.sf+=r.sb; B.sa+=r.sa;
      if (r.w==="a"){A.w++;B.l++;A.form.push("W");B.form.push("L");}
      else if (r.w==="b"){B.w++;A.l++;B.form.push("W");A.form.push("L");}
      else {A.d++;B.d++;A.form.push("D");B.form.push("D");}
    });
    var list=Object.keys(rows).map(function(k){var x=rows[k]; x.pts=x.w*S.pts.w+x.d*S.pts.d+x.l*S.pts.l; x.gd=x.gf-x.ga; x.sd=x.sf-x.sa; return x;});
    list.sort(function(x,y){
      return y.pts-x.pts || (setsMode() ? y.sd-x.sd : 0) || y.gd-x.gd || y.gf-x.gf || h2h(x.id,y.id) || x.name.localeCompare(y.name);
    });
    return list;
  }
  function h2h(x,y){
    var s=0;
    S.matches.forEach(function(m){ var r=result(m); if(!r) return;
      if (m.a===x&&m.b===y){ if(r.w==="a") s--; else if(r.w==="b") s++; }
      if (m.a===y&&m.b===x){ if(r.w==="a") s++; else if(r.w==="b") s--; }
    });
    return s;
  }
  function standingsAm(){
    var rows={};
    S.teams.forEach(function(t){ rows[t.id]={id:t.id,name:t.name||"Unnamed",p:0,w:0,d:0,l:0,pf:0,pa:0,form:[]}; });
    ordered().forEach(function(m){
      var r=result(m); if(!r) return;
      function apply(ids,f,a,res){ ids.forEach(function(id){ var x=rows[id]; if(!x) return; x.p++; x.pf+=f; x.pa+=a;
        if(res==="W")x.w++; else if(res==="L")x.l++; else x.d++; x.form.push(res); }); }
      apply(m.a, r.ga, r.gb, r.w==="a"?"W":r.w==="b"?"L":"D");
      apply(m.b, r.gb, r.ga, r.w==="b"?"W":r.w==="a"?"L":"D");
    });
    var list=Object.keys(rows).map(function(k){var x=rows[k]; x.diff=x.pf-x.pa; x.avg=x.p? x.pf/x.p : 0; return x;});
    var byAvg = S.rankBy==="avg";
    list.sort(function(x,y){
      return (byAvg ? y.avg-x.avg : y.pf-x.pf) || y.w-x.w || y.diff-x.diff || x.name.localeCompare(y.name);
    });
    return list;
  }

  /* ---------- render ---------- */
  var app = document.getElementById("app");
  function render(){
    var played = S.matches.filter(function(m){return m.score;}).length, total=S.matches.length;
    var st = statusText(), who = AM() ? "players" : "teams";
    var h = '<div class="wrap"><header><div><h1>'+esc(S.name||"Round Robin")+'</h1>' +
      '<div class="sub">'+(S.started? played+' of '+total+' matches played · '+S.teams.length+' '+who+(AM()?' · Americano':'') : 'Set up your '+who+' to get started')+'</div></div>' +
      '<button id="status" data-act="diag" class="status '+st[1]+'">'+esc(st[0])+'</button></header>';
    if (readOnly) h += '<div class="banner">You can view this tracker but not edit it.</div>';
    if (ui.tab==="rules" && !AM()) ui.tab="setup";

    h += '<nav class="tabs">' + tabs.map(function(t){
      return '<button data-tab="'+t+'" class="'+(ui.tab===t?"on":"")+'">'+({matches:"Matches",table:"Today",overall:"Overall",rules:"Rules",setup:"Setup"})[t]+'</button>';
    }).join("") + '</nav>';

    else if (ui.tab==="matches") h += viewMatches(played,total);

    else if (ui.tab==="rules") h += viewRules();
    else h += viewSetup();
    h += '</div>';
    if (ui.modal && ui.modal.kind==="diag") h += viewDiag();
    else if (ui.modal && ui.modal.kind==="session") h += viewSession();
    else if (ui.modal && ui.modal.kind==="live") h += viewLive();
    else if (ui.modal) h += viewModal();
    keepAwake(!!(ui.modal && ui.modal.kind==="live"));
    app.innerHTML = h;
  }

  function viewMatches(played,total){
    if (!S.started) return '<div class="card empty">No fixtures yet.<br><br><button class="btn" data-tab="setup" style="max-width:240px;margin:auto">Go to setup</button></div>';
    var h = '<div class="card"><div class="toolbar"><strong>'+(total-played===0?"All matches played 🎾":(total-played)+" to play")+'</strong>' +
      '<button class="chip '+(ui.unplayedOnly?"on":"")+'" data-act="toggle-unplayed">Unplayed only</button></div>' +
      '<div class="progress"><i style="width:'+(total?Math.round(played/total*100):0)+'%"></i></div></div>';
    var byRound={};
    S.matches.forEach(function(m){ (byRound[m.r]=byRound[m.r]||[]).push(m); });
    var courts = Math.max(1, S.courts|0), anyShown=false;
    Object.keys(byRound).sort(function(a,b){return a-b;}).forEach(function(r){
      var ms = byRound[r].sort(function(x,y){return x.i-y.i;});
      var shown = ms.filter(function(m){return !ui.unplayedOnly || !m.score;});
      if (!shown.length) return;
      anyShown=true;
      var done = ms.filter(function(m){return m.score;}).length;
      h += '<div class="round-h"><h2>Round '+r+'</h2><span>'+done+'/'+ms.length+' done</span></div>';
      var inRound={}; ms.forEach(function(m){ [].concat(m.a,m.b).forEach(function(p){inRound[p]=1;}); });
      var sitting = S.teams.filter(function(t){return !inRound[t.id];});
      if (sitting.length) h += '<div class="bye">Sitting out: '+sitting.map(function(t){return esc(t.name||"Unnamed");}).join(", ")+'</div>';
      var waves = Math.ceil(ms.length/courts);
      shown.forEach(function(m){
        var idx = ms.indexOf(m), court=(idx%courts)+1, wave=Math.floor(idx/courts)+1;
        var r2 = result(m), sc;
        if (r2){
          var big = setsMode() ? r2.sa+' – '+r2.sb : r2.ga+' – '+r2.gb;
          var sets = setsMode() ? '<span class="sets">'+m.score.a.map(function(v,i){return v+'-'+m.score.b[i];}).join(", ")+'</span>' : '';
          sc = '<span class="big">'+big+'</span>'+sets;
        } else if (m.live && m.live.h){ var lv=liveOf(m); sc = '<span class="vs live">'+lv.a+' – '+lv.b+'</span>'; }
        else sc = '<span class="vs">Add score</span>';
        h += '<button class="match" data-match="'+m.id+'"><div class="court">Court '+court+(waves>1?' · Slot '+wave:'')+'</div>' +
          '<div class="t '+(r2&&r2.w==="b"?"dim":"")+'">'+sideHTML(m,"a")+'</div><div class="sc">'+sc+'</div>' +
          '<div class="t b '+(r2&&r2.w==="a"?"dim":"")+'">'+sideHTML(m,"b")+'</div></button>';
      });
    });
    if (!anyShown) h += '<div class="empty">Every match has a result.</div>';
    if (AM() && !readOnly) h += '<div style="margin-top:16px"><button class="btn ghost" data-act="add-round">+ Add another round</button>' +
      '<div class="hint" style="text-align:center">Pairs players who’ve partnered least so far.</div></div>';
    return h;
  }

  /* ---------- history & overall table ---------- */
  function todayISO(t){ var d=t?new Date(t):new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
  function niceDate(iso){ try { var p=iso.split("-"); return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"}); } catch(e){ return iso; } }
  function currentAsSession(){
    var ms = S.matches.filter(function(m){return m.score;}).map(function(m){
      var r=result(m), A=[].concat(m.a).map(tname), B=[].concat(m.b).map(tname);
      return {r:m.r, a:A, b:B, sa:r.ga, sb:r.gb, ra:setsMode()?r.sa:null, rb:setsMode()?r.sb:null};
    });
    return {id:uid("s"), date:todayISO(S.startedAt||Date.now()), name:S.name||"Session", mode:S.mode, ppm:S.ppm, rankBy:AM()?S.rankBy:"points",
      pts:S.pts, scoring:S.scoring, players:S.teams.map(function(t){return t.name;}), matches:ms};
  }
  function aggregate(sessions){
    var rows={};
    sessions.forEach(function(ss){
      var seen={};
      ss.matches.forEach(function(m){
        var res = (m.ra!=null) ? (m.ra>m.rb?"a":m.rb>m.ra?"b":"d") : (m.sa>m.sb?"a":m.sb>m.sa?"b":"d");
        [["a",m.a,m.sa,m.sb],["b",m.b,m.sb,m.sa]].forEach(function(sd){
          sd[1].forEach(function(n){
            var k=String(n).trim().toLowerCase(); if(!k) return;
            var x=rows[k]||(rows[k]={name:String(n).trim(),sessions:0,p:0,w:0,d:0,l:0,pf:0,pa:0});
            x.name=String(n).trim();
            if(!seen[k]){ seen[k]=1; x.sessions++; }
            x.p++; x.pf+=sd[2]; x.pa+=sd[3];
            if (res==="d") x.d++; else if (res===sd[0]) x.w++; else x.l++;
          });
        });
      });
    });
    return Object.keys(rows).map(function(k){ var x=rows[k]; x.diff=x.pf-x.pa; x.avg=x.p?x.pf/x.p:0; return x; });
  }
  function overallRows(){
    var list = H.sessions.slice(), cur = currentAsSession();
    if (cur.matches.length) list.push(cur);
    var rows = aggregate(list), min = S.minMatches|0;
    rows.forEach(function(x){ x.qualified = x.p>=min; });
    rows.sort(function(x,y){ return (y.qualified-x.qualified) || y.avg-x.avg || y.p-x.p || y.pf-x.pf || x.name.localeCompare(y.name); });
    return rows;
  }
  function sessionRows(ss){
    var rows = aggregate([ss]);
    if (ss.mode==="americano"){
      var byAvg = ss.rankBy==="avg";
      rows.sort(function(x,y){ return (byAvg? y.avg-x.avg : y.pf-x.pf) || y.w-x.w || y.diff-x.diff || x.name.localeCompare(y.name); });
    } else {
      var pts = ss.pts||{w:3,d:1,l:0};
      rows.forEach(function(x){ x.lp = x.w*pts.w + x.d*pts.d + x.l*pts.l; });
      rows.sort(function(x,y){ return y.lp-x.lp || y.diff-x.diff || y.pf-x.pf || x.name.localeCompare(y.name); });
    }
    return rows;
  }
  function viewOverall(){
    var rows = overallRows(), min = S.minMatches|0, cur = currentAsSession().matches.length;

  /* ---------- Americano rules ---------- */
  function serveBlock(ppm){ return ({16:4,21:5,24:6,32:4})[ppm] || 4; }
  function servePlan(ppm){ // [{who:0..3, from, to}] ; who order: A1, B1, A2, B2
    var blk=serveBlock(ppm), out=[], p=1, i=0;
    while (p<=ppm){ var to=Math.min(ppm,p+blk-1); out.push({who:i%4,from:p,to:to}); p=to+1; i++; }
    return out;
  }
  function viewRules(){
    var ppm=S.ppm, blk=serveBlock(ppm), half=ppm?Math.floor(ppm/2):0;
    var labels=[["A","p1","Pair 1 – first server"],["C","p2","Pair 2 – first server"],["B","p1","Pair 1 – partner"],["D","p2","Pair 2 – partner"]];
    var h='<div class="stack rules">';
    h+='<div class="card"><h2>Scoring</h2><ul>'+
      '<li>Every rally is worth <b>1 point</b>, whoever served. There’s no 15-30-40, deuce or advantage.</li>'+
      (ppm? '<li>A match is <b>'+ppm+' points in total</b>, so it ends when '+ppm+' rallies have been played. It is <i>not</i> first to '+ppm+'. Scores always add up to '+ppm+' (e.g. '+Math.ceil(ppm*0.6)+'–'+(ppm-Math.ceil(ppm*0.6))+' or '+half+'–'+(ppm-half)+').</li>'
          : '<li>Matches are <b>timed</b>. When time is called, finish the rally being played, then stop. The score at that moment is the result.</li>')+
      '<li>Both players in a pair get the <b>pair’s score</b> as their own points. Win 15–9 and you each add 15; your opponents each add 9.</li>'+
      (ppm && ppm%2===0? '<li>A '+half+'–'+half+' draw is fine. Nobody plays an extra point.</li>':'')+
      '<li>The player with the most points at the end wins'+(S.rankBy==="avg"?' (this event ranks by <b>average points per match</b>, so sitting out doesn’t cost anyone)':'')+'. Ties are split by most wins, then the best points difference.</li>'+
      '</ul></div>';
    h+='<div class="card"><h2>Service rotation</h2>'+
      '<p>Serve passes between the pairs, and each player serves a block of <b>'+blk+' points in a row</b>:</p>'+
      '<div class="serve">'+labels.map(function(l){return '<span class="who '+l[1]+'">'+l[0]+'</span><span class="lbl">'+l[2]+'</span><span></span>';}).join("")+'</div>';
    if (ppm){
      var plan=servePlan(ppm), each=[0,0,0,0];
      plan.forEach(function(b){ each[b.who]+=b.to-b.from+1; });
      h+='<p class="ex">For a '+ppm+'-point match:</p><div class="serve">'+plan.map(function(b){
        var l=labels[b.who];
        return '<span class="who '+l[1]+'">'+l[0]+'</span><span class="rng">Points '+b.from+(b.to>b.from?'–'+b.to:'')+'</span><span class="rng">'+(b.to-b.from+1)+' serve'+(b.to>b.from?'s':'')+'</span>';
      }).join("")+'</div>';
      var even = each.every(function(x){return x===each[0];});
      h+= even ? '<p class="ex">Everyone serves '+each[0]+' points, so it’s level.</p>'
        : '<p class="ex">21 can’t be split evenly, so player A serves the final point. Use 16, 24 or 32 if you want everyone to serve the same number.</p>';
    } else {
      h+='<p class="ex">Keep cycling A → C → B → D in blocks of '+blk+' until time is called. The next match starts again with a fresh rotation.</p>';
    }
    h+='<p>Before the first point, each pair decides who serves first in their pair (A and C). Keep that order for the whole match. The score sheet for each match shows a suggested order with names.</p></div>';
    h+='<div class="card"><h2>Serving basics</h2><ul>'+
      '<li>Start each block from the <b>right-hand</b> side, then switch sides after every point.</li>'+
      '<li>Bounce the ball behind the service line and hit it underarm, at or below waist height. Serve diagonally into the opposite service box.</li>'+
      '<li>You get <b>two serves</b> for each point. A double fault gives the point to the receivers. A let (the ball clips the net and lands in) is replayed.</li>'+
      '<li>The receiving pair chooses who takes the right and left sides, and keeps those sides for the match.</li>'+
      '<li>If someone serves out of turn, swap to the correct server as soon as you notice. Points already played still count.</li>'+
      '</ul></div>';
    h+='<div class="card"><h2>Changing ends</h2><p>'+(ppm? 'Swap ends once, after point '+half+', so both pairs play the same number of points from each end. The serve rotation carries on where it left off.'
        : 'Swap ends halfway through the time, so conditions are even. The serve rotation carries on where it left off.')+'</p>'+
      '<p class="ex">This is a common house rule for Americano rather than an official one. Agree it before you start.</p></div>';
    h+='<div class="card"><h2>Sitting out &amp; scoring in</h2><ul>'+
      '<li>Whoever is sitting out each round is listed above that round on the Matches tab.</li>'+
      '<li>Enter one pair’s score in the app'+(ppm?' and the other fills in automatically.':'.')+' Either pair can do it.</li>'+
      '<li>If someone has to leave early, rank by <b>average per match</b> in Setup so it stays fair.</li>'+
      '</ul></div>';
    h+='</div>';
    return h;
  }

  /* ---------- live point-by-point scoring ---------- */
  function liveOf(m){
    var h=(m.live&&m.live.h)||"", a=0, b=0;
    for (var i=0;i<h.length;i++){ if (h[i]==="a") a++; else b++; }
    return {h:h,a:a,b:b};
  }
  function serverAt(m,k){
    var blk=serveBlock(S.ppm), order=[m.a[0],m.b[0],m.a[1],m.b[1]], idx=Math.floor(k/blk)%4;
    return {id:order[idx], pair: idx%2===0?"a":"b", side: (k%blk)%2===0?"right":"left", left: blk-(k%blk)};
  }
  var wakeLock=null;
  function keepAwake(on){
    try {
      if (on && !wakeLock && navigator.wakeLock) navigator.wakeLock.request("screen").then(function(w){ wakeLock=w; w.addEventListener("release",function(){wakeLock=null;}); }).catch(function(){});
      if (!on && wakeLock){ wakeLock.release(); wakeLock=null; }
    } catch(e){}
  }
  document.addEventListener("visibilitychange", function(){ if (document.visibilityState==="visible" && ui.modal && ui.modal.kind==="live"){ wakeLock=null; keepAwake(true); } });
  function viewLive(){
    var m=ui.modal.m, L=liveOf(m), k=L.a+L.b, ppm=S.ppm, done = ppm>0 && k>=ppm, half=Math.floor(ppm/2);
    var sv = done ? null : serverAt(m,k), courtNo = 0;
    var inRound = S.matches.filter(function(x){return x.r===m.r;}).sort(function(x,y){return x.i-y.i;});
    courtNo = (inRound.indexOf(m) % Math.max(1,S.courts|0)) + 1;
    function panel(s){
      var ids=m[s], win = done && ((s==="a"&&L.a>L.b)||(s==="b"&&L.b>L.a));
      var names = ids.map(function(id){ var n=esc(tname(id)); return (sv && sv.id===id) ? '🎾 <b>'+n+'</b>' : n; }).join(' &amp; ');
      return '<button class="lp '+(sv&&sv.pair===s?"serving":"")+(win?" won":"")+'" data-live="'+s+'"'+(done||readOnly?" disabled":"")+'>' +
        '<span class="nm">'+names+'</span><span class="num">'+L[s]+'</span>' +
        (done ? (win?'<span class="tap">Winners</span>':'') : '<span class="tap">Tap when this pair wins the point</span>') + '</button>';
    }
    var mid;
    if (done){
      mid = '<div class="lmid"><b>Match complete – '+L.a+'–'+L.b+'</b><div class="k">Tap undo if the last point was wrong.</div></div>';
    } else {
      mid = '<div class="lmid">Point <b>'+(k+1)+'</b>'+(ppm?' of '+ppm+' · '+(ppm-k)+' left':'') +
        '<br>🎾 <b>'+esc(tname(sv.id))+'</b> serves from the <b>'+sv.side+'</b>' +
        '<div class="k">'+(sv.left===1?'Last serve before it passes on':sv.left+' serves left in this turn')+'</div></div>';
      if (ppm && k===half && k>0) mid = '<div class="ends">⇄ Halfway – change ends now</div>' + mid;
    }
    var canSave = !readOnly && (done || (!ppm && k>0));
    return '<div class="live-wrap">' +
      '<div class="live-top"><div class="ttl">Round '+m.r+' · Court '+courtNo+'<span>Live score – everyone sees it as you tap</span></div>' +
      '<button class="icon" data-act="close" aria-label="Close">×</button></div>' +
      panel("a") + mid + panel("b") +
      '<div class="lbar"><button class="btn ghost" data-act="live-undo"'+(k&&!readOnly?"":" disabled")+'>↶ Undo</button>' +
      (canSave ? '<button class="btn" data-act="live-save">Save result '+L.a+'–'+L.b+'</button>'
               : '<button class="btn ghost" data-act="close">'+(ppm?'Close (score is kept)':'Close')+'</button>') + '</div>' +
      '</div>';
  }

  function ago(t){ if(!t) return ""; var s=Math.round((Date.now()-t)/1000); return " \u00b7 "+(s<60? s+"s ago" : Math.round(s/60)+" min ago"); }
  function viewDiag(){
    var url = SHEET_API_URL.trim();
    var urlNote = !url ? "Not set \u2013 paste your /exec URL into SHEET_API_URL in index.html."
      : !USE_API ? "This doesn\u2019t look like an Apps Script web app URL. It should start https://script.google.com/macros/s/"
      : /\/dev(\?|$)/.test(url) ? "This is the /dev test URL \u2013 use the /exec URL from Deploy \u2192 Manage deployments."
      : !/\/exec(\?|$)/.test(url) ? "This should end in /exec." : "Looks right.";
    var pend = (inflight?1:0) + queue.length;
    return '<div class="scrim" data-act="close-bg"><div class="sheet"><h3>Connection</h3><dl class="diag">' +
      '<dt>Status</dt><dd>'+esc(statusText()[0])+'</dd>' +
      '<dt>Sheet URL</dt><dd>'+esc(url ? url.slice(0,48)+(url.length>48?"\u2026":"") : "(empty)")+'<br><span class="hint">'+esc(urlNote)+'</span></dd>' +
      '<dt>Reading from the sheet</dt><dd>'+esc(diag.get)+esc(ago(diag.getAt))+'</dd>' +
      '<dt>Saving to the sheet</dt><dd>'+esc(diag.post)+esc(ago(diag.postAt))+'</dd>' +
      '<dt>Changes waiting to send</dt><dd>'+pend+'</dd>' +
      '<dt>Tournament id</dt><dd>'+esc(TID)+'</dd></dl>' +
      '<div class="actions"><button class="btn" data-act="diag-retry">Retry now</button>' +
      '<button class="btn ghost" data-act="diag-copy">'+(ui.diagCopied?"Copied \u2713":"Copy these details")+'</button>' +
      '<button class="btn ghost" data-act="close">Close</button></div></div></div>';
  }

  function viewModal(){
    var md = ui.modal, m = md.m, ro = readOnly?" disabled":"";
    var h = '<div class="scrim" data-act="close-bg"><div class="sheet"><h3>Round '+m.r+'</h3>' +
      (AM() && !m.score && !readOnly ? '<button class="btn" data-act="live-open" style="margin:10px 0 2px">▶ Score live, point by point</button><div class="hint" style="text-align:center">Or enter the final score below.</div>' : '') +
      '<div class="vsline"><div>'+esc(side(m,"a"))+'</div><span>vs</span><div>'+esc(side(m,"b"))+'</div></div>';
    if (AM()){
      var order=[m.a[0],m.b[0],m.a[1],m.b[1]].map(tname), blk=serveBlock(S.ppm);
      h += '<div class="svline">Serve order: '+order.map(function(n,i){
        return '<b>'+esc(n)+'</b>'+(S.ppm?' ('+(i*blk+1)+'–'+Math.min(S.ppm,(i+1)*blk)+')':'');
      }).join(' → ')+(S.ppm && 4*blk<S.ppm?', then repeat':'')+(S.ppm?'':' — '+blk+' points each, repeat')+'</div>';
    }
    if (!setsMode()){
      h += '<div class="grid2">' + ['a','b'].map(function(s){
        return '<div class="stepper"><input class="val" type="number" inputmode="numeric" min="0" data-single="'+s+'" value="'+md[s][0]+'"'+ro+'><div class="ctl">' +
          '<button data-step="'+s+'" data-d="-1"'+ro+'>−</button><button data-step="'+s+'" data-d="1"'+ro+'>+</button></div></div>';
      }).join("") + '</div>';
      if (AM() && S.ppm) h += '<div class="hint" style="text-align:center;margin-top:10px">Scores add up to '+S.ppm+' — the other side fills in for you.</div>';
    } else {
      h += '<div class="setgrid"><span></span><div class="hd">'+esc(side(m,"a"))+'</div><div class="hd">'+esc(side(m,"b"))+'</div>';
      for (var i=0;i<3;i++){
        h += '<span class="lab">Set '+(i+1)+'</span>' +
          '<input type="number" inputmode="numeric" min="0" data-set="a" data-i="'+i+'" value="'+(md.a[i]==null?"":md.a[i])+'"'+ro+'>' +
          '<input type="number" inputmode="numeric" min="0" data-set="b" data-i="'+i+'" value="'+(md.b[i]==null?"":md.b[i])+'"'+ro+'>';
      }
      h += '</div><div class="hint">Leave set 3 blank if it wasn’t played. For a match tiebreak, enter it as 1-0.</div>';
    }
    if (md.err) h += '<div class="err">'+esc(md.err)+'</div>';
    h += '<div class="actions">' + (readOnly?'':'<button class="btn" data-act="save">Save result</button>') +
      (m.score && !readOnly ? '<button class="btn ghost" data-act="clear">Clear result</button>':'') +
      '<button class="btn ghost" data-act="close">'+(readOnly?"Close":"Cancel")+'</button></div></div></div>';
    return h;
  }

  /* ---------- events ---------- */
  function findMatch(id){for(var i=0;i<S.matches.length;i++) if(S.matches[i].id===id) return S.matches[i]; return null;}
  function setSingle(s,v){
    var md=ui.modal; v=Math.max(0, v|0); md[s][0]=v;
    if (AM() && S.ppm){ var o = s==="a"?"b":"a"; md[o][0]=Math.max(0,S.ppm-v); var el=app.querySelector('[data-single="'+o+'"]'); if(el) el.value=md[o][0]; }
    md.err="";
  }

  app.addEventListener("click", function(e){
    var t = e.target.closest("button,[data-act='close-bg']"); if(!t) return;
    if (t.dataset.act==="close-bg" && e.target!==t) return;
    var d = t.dataset;
    if (d.act!=="reset" && ui.resetArmed){ ui.resetArmed=false; }
    if (d.act!=="finish" && ui.finishArmed){ ui.finishArmed=false; }
    if (d.act!=="del-session" && ui.delArmed){ ui.delArmed=false; }
    if (d.session){ ui.modal={kind:"session", id:d.session, m:{id:null}}; ui.delArmed=false; render(); return; }
    if (d.minm!=null && t.hasAttribute("data-minm")){ S.minMatches=+d.minm; commit(); return; }
    if (d.tab){ ui.tab=d.tab; ui.copied=false; ui.copiedOverall=false; if (d.tab==="overall") fetchHistory(); render(); window.scrollTo(0,0); return; }
    if (d.match){
      var m = findMatch(d.match), sm = setsMode();
      if (AM() && !m.score && m.live && m.live.h){ ui.modal = {kind:"live", m:m}; render(); return; }
      var a = m.score ? m.score.a.slice() : (sm?[]:[0]);
      var b = m.score ? m.score.b.slice() : (sm?[]:[0]);
      if (!m.score && AM() && S.ppm){ a=[Math.ceil(S.ppm/2)]; b=[Math.floor(S.ppm/2)]; }
      ui.modal = {m:m,a:a,b:b,err:""}; render(); return;
    }
    if (d.live){
      var mm=ui.modal.m, LL=liveOf(mm);
      if (S.ppm && LL.a+LL.b>=S.ppm) return;
      mm.live = {h:LL.h+d.live, t:Date.now()};
      try { navigator.vibrate && navigator.vibrate(12); } catch(e){}
      commitLive(mm); return;
    }
    if (d.step){ setSingle(d.step,(ui.modal[d.step][0]||0)+(+d.d)); render(); return; }
    if (d.mode){ S.mode=d.mode; commit(); return; }
    if (d.ppm!=null && t.hasAttribute("data-ppm")){ S.ppm=+d.ppm; commit(); return; }
    if (d.rank){ S.rankBy=d.rank; commit(); return; }
    if (d.scoring){ S.scoring=d.scoring; commit(); return; }
    if (t.hasAttribute("data-double")){ S.double = d.double==="1"; commit(); return; }
    if (d.del){ S.teams = S.teams.filter(function(x){return x.id!==d.del;}); commit(); return; }
    switch(d.act){
      case "toggle-unplayed": ui.unplayedOnly=!ui.unplayedOnly; render(); break;
      case "add-team": S.teams.push({id:uid("t"),name:""}); commit();
        setTimeout(function(){var ins=app.querySelectorAll("[data-team]"); if(ins.length) ins[ins.length-1].focus();},0); break;
      case "generate":
        S.teams.forEach(function(x){x.name=x.name.trim();});
        t.textContent="Building fixtures…"; t.classList.add("busy");
        setTimeout(function(){
          S.matches = AM() ? scheduleAmericano([], amRounds()) : generateTeams();
          S.startedAt = Date.now();
          S.started = true; ui.tab="matches"; commit(); window.scrollTo(0,0);
        }, 30);
        break;
      case "add-round":
        t.textContent="Adding…"; t.classList.add("busy");
        setTimeout(function(){ var add = scheduleAmericano(S.matches,1); S.matches = S.matches.concat(add); commitNewMatches(add); }, 30);
        break;
      case "finish":
        if (!ui.finishArmed){ ui.finishArmed=true; render(); }
        else { ui.finishArmed=false; finishSession(); }
        break;
      case "del-session":
        if (!ui.delArmed){ ui.delArmed=true; render(); }
        else { ui.delArmed=false; deleteSession(ui.modal.id); }
        break;
      case "copy-overall":
        var olines=["Overall table \u2013 average points per match",""];
        overallRows().forEach(function(x,i){ olines.push((x.qualified?(i+1)+". ":"\u2013 ")+x.name+" \u2014 avg "+x.avg.toFixed(1)+" ("+x.p+" matches, "+x.w+" wins)"); });
        var otxt=olines.join("\n");
        try { navigator.clipboard.writeText(otxt).then(function(){ui.copiedOverall=true;render();}).catch(function(){fallbackCopy(otxt);}); } catch(e){ fallbackCopy(otxt); }
        break;
      case "reset":
        if (!ui.resetArmed){ ui.resetArmed=true; render(); }
        else { ui.resetArmed=false; S.matches=[]; S.started=false; ui.tab="setup"; commit(); }
        break;
      case "close": case "close-bg": ui.modal=null; render(); break;
      case "diag": ui.modal = {kind:"diag", m:{id:null}}; ui.diagCopied=false; render(); break;
      case "diag-retry": net = USE_API ? "connecting" : "local"; poll(); flush(); setTimeout(render, 2500); render(); break;
      case "diag-copy":
        var dtxt = "URL: "+SHEET_API_URL.trim()+"\nRead: "+diag.get+"\nSave: "+diag.post+"\nWaiting: "+((inflight?1:0)+queue.length)+"\nStatus: "+statusText()[0];
        try { navigator.clipboard.writeText(dtxt).then(function(){ui.diagCopied=true;render();}).catch(function(){fallbackCopy(dtxt);}); } catch(e){ fallbackCopy(dtxt); }
        break;
      case "live-open": ui.modal = {kind:"live", m:ui.modal.m}; render(); break;
      case "live-undo": var um=ui.modal.m, uh=liveOf(um).h; um.live = uh.length>1 ? {h:uh.slice(0,-1), t:Date.now()} : null; commitLive(um); break;
      case "live-save":
        var lm=ui.modal.m, L=liveOf(lm);
        lm.score={a:[L.a],b:[L.b]}; lm.live=null; ui.modal=null; commitScore(lm); break;
      case "clear": var cm=ui.modal.m; cm.score=null; ui.modal=null; commitScore(cm); break;
      case "save": saveScore(); break;
      case "copy": copyTable(); break;
    }
  });

  app.addEventListener("input", function(e){
    var el=e.target;
    if (el.dataset.set){ var v=el.value===""?null:Math.max(0,parseInt(el.value,10)||0); ui.modal[el.dataset.set][+el.dataset.i]=v; ui.modal.err=""; }
    if (el.dataset.single && el.value!==""){ setSingle(el.dataset.single, parseInt(el.value,10)||0); }
  });
  app.addEventListener("focusin", function(e){ if (e.target.classList && e.target.classList.contains("val")) e.target.select(); });
  app.addEventListener("change", function(e){
    var el=e.target, d=el.dataset;
    if (d.team){ var tm=team(d.team); if(tm){ tm.name=el.value.trim(); commit(); } }
    else if (d.field==="name"){ S.name=el.value.trim()||"Round Robin"; commit(); }
    else if (d.field==="courts"){ S.courts=Math.max(1,Math.min(20,parseInt(el.value,10)||1)); commit(); }
    else if (d.field==="rounds"){ S.rounds=Math.max(0,Math.min(60,parseInt(el.value,10)||0)); commit(); }
    else if (d.pts){ S.pts[d.pts]=parseInt(el.value,10)||0; commit(); }
  });
  app.addEventListener("keydown", function(e){
    if (e.key==="Enter" && e.target.dataset.team && !S.started){ e.target.blur(); }
    if (e.key==="Escape" && ui.modal){ if (ui.modal.kind==="live") return; ui.modal=null; render(); }
  });

  function saveScore(){
    var md=ui.modal, a=[], b=[];
    if (setsMode()){
      for (var i=0;i<3;i++){
        var x=md.a[i], y=md.b[i];
        if (x==null && y==null) continue;
        if (x==null || y==null){ md.err="Set "+(i+1)+" needs a score for both sides."; render(); return; }
        a.push(x); b.push(y);
      }
      if (!a.length){ md.err="Enter at least one set."; render(); return; }
    } else {
      a=[md.a[0]||0]; b=[md.b[0]||0];
      if (AM() && S.ppm && a[0]+b[0]!==S.ppm){ md.err="Scores should add up to "+S.ppm+" (currently "+(a[0]+b[0])+")."; render(); return; }
    }
    md.m.score={a:a,b:b}; var sm=md.m; ui.modal=null; commitScore(sm);
  }

  function copyTable(){
    var lines=[S.name, ""];
    if (AM()){
      standingsAm().forEach(function(x,i){
        lines.push((i+1)+". "+x.name+" — "+x.pf+" pts ("+x.w+"W "+x.d+"D "+x.l+"L, "+sign(x.diff)+(S.rankBy==="avg"?", avg "+x.avg.toFixed(1):"")+")");
      });
    } else {
      standingsTeams().forEach(function(x,i){
        lines.push((i+1)+". "+x.name+" — "+x.pts+" pts ("+x.w+"W "+x.d+"D "+x.l+"L, games "+sign(x.gd)+(setsMode()?", sets "+sign(x.sd):"")+")");
      });
    }
    var txt=lines.join("\n");
    try {
      navigator.clipboard.writeText(txt).then(function(){ui.copied=true;render();}).catch(function(){fallbackCopy(txt);});
    } catch(e){ fallbackCopy(txt); }
  }
  function fallbackCopy(txt){
    var ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); ui.copied=true; }catch(e){}
    document.body.removeChild(ta); render();
  }

  render();

  app.addEventListener("focusout", function(){ if (pendingRender){ pendingRender=false; setTimeout(function(){ if(!app.contains(document.activeElement)||document.activeElement===document.body) render(); else pendingRender=true; }, 0); } });
  connect();
})();
</script>
</body>
</html>
